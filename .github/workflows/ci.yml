name: CI

# Runs only on demand (Actions tab -> CI -> Run workflow) to save Actions minutes.
# Full verification happens locally; the release workflow builds on version tags.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: clippy (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install GPUI Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libxcb1-dev libfontconfig-dev libssl-dev libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GPUI Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libxcb1-dev libfontconfig-dev libssl-dev libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked
