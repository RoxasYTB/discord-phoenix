name: 🔊 Voice or video / Vocal ou vidéo
description: Audio, microphone, camera, screen share or soundboard problem · Problème de son, micro, caméra, partage d'écran ou soundboard
title: '[Voice] '
labels:
- voice
- bug
- needs-repro
body:
- type: markdown
  attributes:
    value: |
      **Before you start / Avant de commencer** — read the [reporting guide](https://github.com/RoxasYTB/project-phoenix/blob/main/docs/REPORTING_BUGS.md) · lis le [guide de signalement](https://github.com/RoxasYTB/project-phoenix/blob/main/docs/SIGNALER_UN_BUG.md).

      🔒 **Never paste a token, cookies, a HAR file or `journal.log`. Blur usernames, messages, emails and private servers in screenshots.**

      🔒 **Ne colle jamais de token, de cookies, de fichier HAR ni `journal.log`. Floute pseudos, messages, e-mails et serveurs privés sur les captures.**

      Discord Phoenix is unofficial: don't report its bugs to Discord. · Phoenix n'est pas officiel : ne signale pas ses bugs à Discord.

      Never record other people's voices or faces. · N'enregistre jamais la voix ni le visage d'autres personnes.
- type: checkboxes
  id: searched
  attributes:
    label: Checks / Vérifications
    options:
    - label: I searched the existing issues (open and closed) and this one is new. · J'ai cherché dans les issues (ouvertes et fermées) et celle-ci est nouvelle.
      required: true
    - label: I'm on the latest release, or I say below which version I use. · J'utilise la dernière version, ou j'indique ci-dessous laquelle.
      required: true
- type: textarea
  id: summary
  attributes:
    label: Summary / Résumé
    description: One or two sentences. · Une ou deux phrases.
  validations:
    required: true
- type: dropdown
  id: voice-area
  attributes:
    label: What is affected? / Qu'est-ce qui est touché ?
    options:
    - Joining, connection / Connexion au salon
    - Hearing others / Entendre les autres
    - Others hearing me / Les autres m'entendent
    - Microphone, noise suppression / Micro, suppression du bruit
    - Push to talk / Appuyer pour parler
    - Camera / Caméra
    - Screen share, Go Live / Partage d'écran, Go Live
    - Watching a stream / Regarder un stream
    - Soundboard
    - Other / Autre
    multiple: true
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce / Étapes pour reproduire
    description: Numbered, starting from a fresh launch. · Numérotées, en partant d'un lancement de l'app.
    placeholder: |
      1. Open a server text channel / Ouvrir un salon textuel
      2. Hover a message / Survoler un message
      3. Click … / Cliquer sur …
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected / Attendu
    description: What the official client does. · Ce que fait le client officiel.
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Actual / Obtenu
    description: What Phoenix does instead. · Ce que fait Phoenix.
  validations:
    required: true
- type: dropdown
  id: frequency
  attributes:
    label: How often? / Fréquence
    options:
    - Always / Toujours
    - Sometimes / Parfois
    - Once / Une seule fois
  validations:
    required: true
- type: input
  id: regression
  attributes:
    label: Regression? / Régression ?
    description: Did it work in an earlier version? Which one? · Ça marchait dans une version précédente ? Laquelle ?
    placeholder: Worked in 0.1.0-beta.1 (abcd1234) / Never worked / Don't know · Jamais marché / Je ne sais pas
  validations:
    required: false
- type: dropdown
  id: official
  attributes:
    label: Same action in the official client? / Même action dans le client officiel ?
    options:
    - Official client works / Le client officiel fonctionne
    - Official client has the same bug / Même bug dans le client officiel
    - Not tested / Pas testé
  validations:
    required: true
- type: dropdown
  id: channel-kind
  attributes:
    label: Where? / Où ?
    options:
    - Server voice channel / Salon vocal de serveur
    - Stage channel / Salon de conférence
    - DM or group call / Appel en MP ou en groupe
  validations:
    required: true
- type: textarea
  id: devices
  attributes:
    label: Devices / Périphériques
    description: Input and output devices and how they connect (USB, Bluetooth, jack), sound server (PipeWire, PulseAudio), camera model. · Entrée, sortie, connexion, serveur de son, caméra.
    placeholder: 'Mic: Blue Yeti (USB) · Output: headset (Bluetooth) · PipeWire 1.4 · Camera: Logitech C920'
  validations:
    required: true
- type: input
  id: codec
  attributes:
    label: Codec (if known) / Codec (si connu)
    placeholder: Opus, H.264, VP8, VP9, AV1…
  validations:
    required: false
- type: input
  id: participants
  attributes:
    label: Other participants / Autres participants
    description: How many, and on which client (official desktop, browser, mobile). · Combien, et sur quel client.
    placeholder: 2 others, official desktop client
  validations:
    required: false
- type: textarea
  id: media
  attributes:
    label: Screenshots or video / Captures ou vidéo
    description: A short video helps. Mute or blur other people. · Une courte vidéo aide. Coupe ou floute les autres personnes.
  validations:
    required: false
- type: textarea
  id: debug-info
  attributes:
    label: Debug info / Infos de débogage
    description: Settings › bottom of the left sidebar › **Copy debug info**, then paste here. · Paramètres › bas de la barre de gauche › **Copier les infos de débogage**, puis colle ici.
    placeholder: |
      Discord Phoenix 0.1.0-beta.1 (abcd1234)
      OS: ...
      Session: ...
      GPU: ...
    render: text
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: Logs (required / obligatoires)
    description: 'Linux/macOS: `~/.cache/discord-phoenix/logs/phoenix.log` · Windows: `%LOCALAPPDATA%\discord-phoenix\logs\phoenix.log` (or Settings › **Open logs folder** / ou Paramètres › **Ouvrir le dossier des logs**). Paste the last ~200 lines. **Read them before pasting** and remove anything private. · Colle les ~200 dernières lignes. **Relis-les avant de coller** et retire tout ce qui est privé.'
    render: text
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Phoenix version / Version de Phoenix
    description: Shown at the bottom of the Settings sidebar. · Affichée en bas de la barre latérale des Paramètres.
    placeholder: 0.1.0-beta.1 (abcd1234)
  validations:
    required: true
- type: dropdown
  id: os
  attributes:
    label: OS / Système
    options:
    - Linux (Wayland)
    - Linux (X11)
    - Windows 11
    - Windows 10
    - macOS (Apple Silicon)
    - macOS (Intel)
    - Other / Autre
  validations:
    required: true
- type: input
  id: os-version
  attributes:
    label: OS version, desktop / Version de l'OS, bureau
    placeholder: Debian 13 + KDE Plasma 6.5, Fedora 43 + GNOME 49, Windows 11 24H2, macOS 15.1…
  validations:
    required: true
- type: input
  id: gpu
  attributes:
    label: GPU and driver / GPU et pilote
    placeholder: NVIDIA GTX 1080 / 580.95, AMD RX 6700 / Mesa 25.2, Intel UHD 620 / Mesa, Apple M2…
  validations:
    required: true
- type: input
  id: scale
  attributes:
    label: Display scale, Phoenix zoom / Échelle de l'écran, zoom de Phoenix
    description: OS scale (100 %, 125 %, 150 %…) and the zoom in Settings › Appearance. · Échelle de l'OS et zoom dans Paramètres › Apparence.
    placeholder: 150 % screen, 100 % zoom, 2560×1440
  validations:
    required: true
- type: dropdown
  id: theme
  attributes:
    label: Theme / Thème
    options:
    - Dark / Sombre
    - Light / Clair
    - Ash / Cendre
    - Onyx
    - Not sure / Je ne sais pas
  validations:
    required: false
- type: checkboxes
  id: privacy
  attributes:
    label: Privacy / Confidentialité
    options:
    - label: My report contains no token, cookie, HAR file, journal.log, email, phone number or private message, and my screenshots are blurred. · Mon signalement ne contient aucun token, cookie, fichier HAR, journal.log, e-mail, numéro de téléphone ni message privé, et mes captures sont floutées.
      required: true
