[package]
name = "phoenix-app"
version.workspace = true
edition.workspace = true
description = "Discord Phoenix - native GPUI desktop client (UI shell)"

[[bin]]
name = "discord-phoenix"
path = "src/main.rs"

[lib]
name = "phoenix_app"
path = "src/lib.rs"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["wayland", "x11", "font-kit"] }
gpui-component = "0.10.0"
gpui-base = "0.10.0"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
memchr = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
phoenix-api = { path = "../phoenix-api" }
phoenix-voice = { path = "../phoenix-voice", features = ["audio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust", "windows-native", "apple-native"] }
base64 = "0.23"
sha2 = "0.10"
anyhow = "1"
serde_json = "1"
parking_lot = "0.13"
unicode-segmentation = "1.13.3"
qrcode = { version = "0.14", default-features = false }
brotli-decompressor = "4"
flate2 = "1"
wuff = "0.2"
ttf-parser = "0.25"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "adpcm", "flac", "ogg", "vorbis", "isomp4", "aac"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry", "env-filter", "tracing-log", "smallvec"] }
regex = "1"
cpal = "0.15"
spellbook = "0.4.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
notify-rust = "4.19"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io"] }
raw-window-handle = "0.6"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
anyhow = "1"
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["test-support"] }
png = "0.18"
