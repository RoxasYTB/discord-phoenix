gs.perm.s0: "General Server Permissions"
gs.perm.p10: "View Channels"
gs.perm.p10_desc: "Allows members to view channels by default (excluding private channels)."
gs.perm.p4: "Manage Channels"
gs.perm.p4_desc: "Allows members to create, edit, or delete channels."
gs.perm.p28: "Manage Roles"
gs.perm.p28_desc: "Allows members to create new roles and edit or delete roles lower than their highest role. Also allows members to change permissions of individual channels that they have access to."
gs.perm.p43: "Create Expressions"
gs.perm.p43_desc: "Allows members to add custom emoji, stickers, and sounds in this server."
gs.perm.p30: "Manage Expressions"
gs.perm.p30_desc: "Allows members to edit or remove custom emoji, stickers, and sounds in this server."
gs.perm.p7: "View Audit Log"
gs.perm.p7_desc: "Allows members to view a record of who made which changes in this server."
gs.perm.p19: "View Server Insights"
gs.perm.p19_desc: "Allows members to view Server Insights, which shows data on community growth, engagement, and more. This will allow them to see certain data about channel activity, even for channels they cannot access."
gs.perm.p29: "Manage Webhooks"
gs.perm.p29_desc: "Allows members to create, edit, or delete webhooks, which can post messages from other apps or sites into this server."
gs.perm.p5: "Manage Server"
gs.perm.p5_desc: "Allow members to change this server's name, switch regions, view all invites, add apps to this server and create and update AutoMod rules."
gs.perm.s1: "Membership Permissions"
gs.perm.p0: "Create Invite"
gs.perm.p0_desc: "Allows members to invite new people to this server."
gs.perm.p26: "Change Nickname"
gs.perm.p26_desc: "Allows members to change their own nickname, a custom name for just this server."
gs.perm.p27: "Manage Nicknames"
gs.perm.p27_desc: "Allows members to change the nicknames of other members."
gs.perm.p1: "Kick, Approve, and Reject Members"
gs.perm.p1_desc: "Kick will remove other members from this server. Kicked members will be able to rejoin if they have another invite. If the server enables Member Requirements, this permission enables the ability to approve or reject members who request to join."
gs.perm.p2: "Ban Members"
gs.perm.p2_desc: "Allows members to permanently ban and delete the message history of other members from this server."
gs.perm.p40: "Timeout Members"
gs.perm.p40_desc: "When you put a user in timeout they will not be able to send messages in chat, reply within threads, react to messages, or speak in voice or Stage channels."
gs.perm.s2: "Text Channel Permissions"
gs.perm.p11: "Send Messages and Create Posts"
gs.perm.p11_desc: "Allow members to send messages in text channels and create posts in forum channels."
gs.perm.p38: "Send Messages in Threads and Posts"
gs.perm.p38_desc: "Allow members to send messages in threads and in posts on forum channels."
gs.perm.p35: "Create Public Threads"
gs.perm.p35_desc: "Allow members to create threads that everyone in a channel can view."
gs.perm.p36: "Create Private Threads"
gs.perm.p36_desc: "Allow members to create invite-only threads."
gs.perm.p14: "Embed Links"
gs.perm.p14_desc: "Allows links that members share to show embedded content in text channels."
gs.perm.p15: "Attach Files"
gs.perm.p15_desc: "Allows members to upload files or media in text channels."
gs.perm.p6: "Add Reactions"
gs.perm.p6_desc: "Allows members to add new emoji reactions to a message. If this permission is disabled, members can still react using any existing reactions on a message."
gs.perm.p18: "Use External Emoji"
gs.perm.p18_desc: "Allows members to use emoji from other servers, if they’re a Discord Nitro member."
gs.perm.p37: "Use External Stickers"
gs.perm.p37_desc: "Allows members to use stickers from other servers, if they’re a Discord Nitro member."
gs.perm.p17: "Mention @everyone, @here, and All Roles"
gs.perm.p17_desc: "Allows members to use @everyone (everyone in the server) or @here (only online members in that channel). They can also @mention all roles, even if the role’s “Allow anyone to mention this role” permission is disabled."
gs.perm.p13: "Manage Messages"
gs.perm.p13_desc: "Allows members to delete or remove embeds from messages by other members."
gs.perm.p51: "Pin Messages"
gs.perm.p51_desc: "Allows members to pin or unpin any message."
gs.perm.p52: "Bypass Slowmode"
gs.perm.p52_desc: "Allows members to send messages without being affected by slowmode."
gs.perm.p34: "Manage Threads and Posts"
gs.perm.p34_desc: "Allows members to rename, delete, close, and turn on slow mode for threads and posts. They can also view private threads."
gs.perm.p16: "Read Message History"
gs.perm.p16_desc: "Allows members to read previous messages sent in channels. If this permission is disabled, members only see messages sent when they are online. This does not fully apply to threads and forum posts."
gs.perm.p12: "Send Text-to-Speech Messages"
gs.perm.p12_desc: "Allows members to send text-to-speech messages by starting a message with /tts. These messages can be heard by anyone focused on the channel."
gs.perm.p46: "Send Voice Messages"
gs.perm.p46_desc: "Allows members to send voice messages."
gs.perm.p49: "Create Polls"
gs.perm.p49_desc: "Allows members to create polls."
gs.perm.s3: "Voice Channel Permissions"
gs.perm.p20: "Connect"
gs.perm.p20_desc: "Allows members to join voice channels and hear others."
gs.perm.p21: "Speak"
gs.perm.p21_desc: "Allows members to talk in voice channels. If this permission is disabled, members are default muted until somebody with the “Mute Members” permission un-mutes them."
gs.perm.p9: "Video"
gs.perm.p9_desc: "Allows members to share their video, screen share, or stream a game in this server."
gs.perm.p42: "Use Soundboard"
gs.perm.p42_desc: "Allows members to send sounds from server soundboard."
gs.perm.p45: "Use External Sounds"
gs.perm.p45_desc: "Allows members to use sounds from other servers, if they're a Discord Nitro member."
gs.perm.p25: "Use Voice Activity"
gs.perm.p25_desc: "Allows members to speak in voice channels by simply talking. If this permission is disabled, members are required to use Push-to-talk. Good for controlling background noise or noisy members."
gs.perm.p8: "Priority Speaker"
gs.perm.p8_desc: "Allows members to be more easily heard in voice channels. When activated, the volume of others without this permission will be automatically lowered."
gs.perm.p22: "Mute Members"
gs.perm.p22_desc: "Allows members to mute other members in voice channels for everyone."
gs.perm.p23: "Deafen Members"
gs.perm.p23_desc: "Allows members to deafen other members in voice channels, which means they won’t be able to speak or hear others."
gs.perm.p24: "Move Members"
gs.perm.p24_desc: "Allows members to disconnect or move other members between voice channels that the member with this permission has access to."
gs.perm.p48: "Set Voice Channel Status"
gs.perm.p48_desc: "Allows members to create and edit voice channel status."
gs.perm.s4: "Apps Permissions"
gs.perm.p31: "Use Application Commands"
gs.perm.p31_desc: "Allows members to use commands from applications, including slash commands and context menu commands."
gs.perm.p39: "Use Activities"
gs.perm.p39_desc: "Allows members to use Activities."
gs.perm.p50: "Use External Apps"
gs.perm.p50_desc: "Allows apps that members have added to their account to post messages. When disabled, the messages will be private."
gs.perm.s5: "Stage Channel Permissions"
gs.perm.p32: "Request to Speak"
gs.perm.p32_desc: "Allow requests to speak in Stage channels. Stage moderators manually approve or deny each request."
gs.perm.s6: "Events Permissions"
gs.perm.p44: "Create Events"
gs.perm.p44_desc: "Allows members to create events."
gs.perm.p33: "Manage Events"
gs.perm.p33_desc: "Allows members to edit and cancel events."
gs.perm.s7: "Advanced permissions"
gs.perm.p3: "Administrator"
gs.perm.p3_desc: "Members with this permission will have every permission and will also bypass all channel specific permissions or restrictions (for example, these members would get access to all private channels). With great power comes great responsibility, so think twice before granting this permission."
