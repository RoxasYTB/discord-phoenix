cperm.s0: "General Channel Permissions"
cperm.l0: "View Channel"
cperm.d0: "Allows members to view this channel by default. Disabling this for @everyone will make this channel private."
cperm.l1: "Manage Channel"
cperm.d1: "Allows members to change this channel’s name, description, and text settings. They can also delete the channel."
cperm.l2: "Manage Permissions"
cperm.d2: "Allows members to change this channel’s permissions."
cperm.l3: "Manage Webhooks"
cperm.d3: "Allows members to create, edit, or delete webhooks in this channel, which can post messages from other apps or sites."
cperm.s1: "Membership Permissions"
cperm.l4: "Create Invite"
cperm.d4: "Allows members to invite new people to this server via a direct invite link to this channel."
cperm.s2: "Text Channel Permissions"
cperm.l5: "Send Messages"
cperm.d5: "Allows members to send messages in this channel."
cperm.l6: "Send Messages in Threads"
cperm.d6: "Allow members to send messages in threads under this channel."
cperm.l7: "Create Public Threads"
cperm.d7: "Allow members to create threads that everyone in this channel can view."
cperm.l8: "Create Private Threads"
cperm.d8: "Allow members to create invite-only threads in this channel."
cperm.l9: "Embed Links"
cperm.d9: "Allows links that members share to show embedded content in this channel."
cperm.l10: "Attach Files"
cperm.d10: "Allows members to upload files or media in this channel."
cperm.l11: "Add Reactions"
cperm.d11: "Allows members to add new emoji reactions to a message in this channel. If this permission is disabled, members can still react using any existing reactions on a message."
cperm.l12: "Use External Emoji"
cperm.d12: "Allows members to use emoji from other servers in this channel, if they’re a Discord Nitro member."
cperm.l13: "Use External Stickers"
cperm.d13: "Allows members to use stickers from other servers in this channel, if they’re a Discord Nitro member."
cperm.l14: "Mention @everyone, @here, and All Roles"
cperm.d14: "Allows members to use @everyone or @here (only online members) in this channel. They can also @mention all roles in this channel, even if the role’s “Allow anyone to mention this role” permission is disabled."
cperm.l15: "Manage Messages"
cperm.d15: "Allows members to delete or remove embeds from messages by other members in this channel."
cperm.l16: "Pin Messages"
cperm.d16: "Allows members to pin or unpin any message in this channel."
cperm.l17: "Bypass Slowmode"
cperm.d17: "Allows members to send messages in this channel without being affected by slowmode."
cperm.l18: "Manage Threads"
cperm.d18: "Allows members to rename, delete, close, and turn on slow mode for threads in this channel. They can also view private threads."
cperm.l19: "Read Message History"
cperm.d19: "Allows members to read previous messages sent in this channel. If this permission is disabled, members only see messages sent when they are online."
cperm.l20: "Send Text-to-Speech Messages"
cperm.d20: "Allows members to send text-to-speech messages in this channel by starting a message with /tts. These messages can be heard by anyone focused on this channel."
cperm.l21: "Send Voice Messages"
cperm.d21: "Allows members to send voice messages in this channel. Requires the \"Attach Files\" permission as well."
cperm.l22: "Create Polls"
cperm.d22: "Allows members to create polls in this channel."
cperm.s3: "Apps Permissions"
cperm.l23: "Use Application Commands"
cperm.d23: "Allows members to use commands from applications in this channel, including slash commands and context menu commands."
cperm.l24: "Use Activities"
cperm.d24: "Allows members to use Activities in this channel."
cperm.l25: "Use External Apps"
cperm.d25: "Allows apps that members have added to their account to post messages in this channel. When disabled, the messages will be private."
cperm.d26: "Allows members to publish their own messages to all servers following this Announcement Channel."
cperm.d27: "Allows members to delete or remove embeds from messages by other members in this channel. They can also publish messages by other members to all servers that follow this Announcement Channel."
cperm.d28: "Allows members to view this channel by default. Disabling this and the Connect permission for @everyone will make this channel private."
cperm.d29: "Allows members to change this channel’s name, description, and voice settings. They can also delete the channel."
cperm.d30: "Allows members to invite new people to this server via a direct invite link to this channel. The recipient will automatically join the voice channel if they have permission to connect."
cperm.s4: "Voice Channel Permissions"
cperm.l26: "Connect"
cperm.d31: "Allows members to join this voice channel and hear others. Disabling this and the View Channel permissions for @everyone will make this channel private."
cperm.l27: "Speak"
cperm.d32: "Allows members to talk in this voice channel. If this permission is disabled, members are default muted until somebody with the “Mute Members” permission un-mutes them."
cperm.l28: "Video"
cperm.d33: "Allows members to share their video, screen share, or stream a game in this voice channel."
cperm.l29: "Use Soundboard"
cperm.d34: "Allows members to send sounds from server soundboard in this voice channel.  Learn more."
cperm.l30: "Use External Sounds"
cperm.d35: "Allows members to use sounds from other servers, if they're a Discord Nitro member."
cperm.l31: "Use Voice Activity"
cperm.d36: "Allows members to speak in this voice channel by simply talking. If this permission is disabled, members are required to use Push-to-talk. Good for controlling background noise or noisy members."
cperm.l32: "Priority Speaker"
cperm.d37: "Allows members to be more easily heard in this voice channel. When activated, the volume of others without this permission will be automatically lowered. Priority Speaker is activated by using the Push to Talk (Priority) keybind."
cperm.l33: "Mute Members"
cperm.d38: "Allows members to mute other members in this voice channel for everyone."
cperm.l34: "Deafen Members"
cperm.d39: "Allows members to deafen other members in this voice channel, which means they won’t be able to speak or hear others."
cperm.l35: "Move Members"
cperm.d40: "Allows members to disconnect other members from this channel. They will also be able to move somebody into other channels that they have this permission in."
cperm.l36: "Set Voice Channel Status"
cperm.d41: "Allows members to create and edit voice channel status."
cperm.s5: "Voice Channel Chat Permissions"
cperm.d42: "Allows members to add new emoji reactions to a message in this channel and send reactions in voice channels. If this permission is disabled, members can still react using any existing reactions on a message."
cperm.s6: "Events Permissions"
cperm.l37: "Create Events"
cperm.d43: "Allows members to create events in this channel."
cperm.l38: "Manage Events"
cperm.d44: "Allows members to edit and cancel events in this channel."
cperm.d45: "(Required for Stage moderator) Allow members to set a topic to start the Stage and enable or disable requests to speak. They can also delete the Stage channel."
cperm.d46: "Allow members to join this Stage channel as the audience. Disabling this and the View Channel permissions for @everyone will make this channel private."
cperm.d47: "Allows speakers to share their video, screen share, or stream a game in this Stage channel."
cperm.d48: "(Required for Stage moderator) Allow members to add or remove Speakers."
cperm.d49: "(Required for Stage moderator) Allow members to force others to disconnect from this channel."
cperm.s7: "Stage Channel Permissions"
cperm.l39: "Request to Speak"
cperm.d50: "Allow requests to speak in this Stage channel. Stage moderators manually approve or deny each request."
cperm.l40: "Mention @everyone when a Stage starts"
cperm.d51: "Allow Stage Moderators with this role to notify @everyone when a Stage starts. This is the same permission as Mention @everyone, @here, and All Roles."
cperm.s8: "Forum Channel Permissions"
cperm.l41: "Create Posts"
cperm.d52: "Allow members to create posts in this channel."
cperm.l42: "Send Messages in Posts"
cperm.d53: "Allow members to send messages in threads and posts under this channel."
cperm.l43: "Manage Posts"
