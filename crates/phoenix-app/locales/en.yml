sp.data.t1: "How we use your data"
sp.data.core: "Use data to make Discord work"
sp.data.core_d: "We need to store and process some data in order to provide you the basic Discord service, such as your messages, what servers you're in and your DMs. By using Discord, you allow us to provide this basic service. You can stop this by disabling or deleting your account."
sp.data.improve: "Use data to improve Discord"
sp.data.improve_d: "This setting allows us to use and process information about how you navigate and use Discord for analytical purposes."
sp.data.personalize: "Use data to customize my Discord experience"
sp.data.personalize_d: "This setting allows us to use information, such as who you talk to and what games you play, to customize Discord for you."
sp.data.sponsored: "Use my Discord activity to personalize sponsored content"
sp.data.sponsored_d: "This allows us to personalize sponsored content, like Quests, using your Discord activity, such as the games you play. If you turn this off, you will still see Quests, but they won't be personalized."
sp.data.third: "Use third-party data to personalize sponsored content"
sp.data.third_d: "This allows us to personalize sponsored content, like Quests, using data we receive from advertisers and third-party data providers. If you turn this off, you will still see Quests, but they won't be personalized with third-party data."
sp.data.discovery: "Show my message content from Discoverable channels on web pages"
sp.data.discovery_d: "Allows the content of messages you send in Discoverable channels to appear on web pages. Admins of Discoverable servers control which channels are Discoverable. These messages will appear as you wrote them, but won't show your username."
sp.data.clips: "Allow my voice to be recorded in Clips"
sp.data.clips_d: "Allows your voice to be included when someone in the same voice channel makes a clip."
