sp.bo.community: "Boost your community and stand out"
sp.bo.c1: "Show your support with a member list icon"
sp.bo.c2: "Unlock a profile badge that evolves over time"
sp.bo.c3: "Get an exclusive booster role"
sp.bo.c4: "Show your support for your community"
sp.bo.faq: "Boost FAQ"
sp.bo.q1: "What is a Server Boost?"
sp.bo.q2: "How do I boost a server?"
sp.bo.q3: "Can I boost a server more than once?"
sp.bo.q4: "Can I keep boosting a server after it reaches Level 3?"
sp.bo.q5: "What are \"extra perks\" and how are they different from levels?"
sp.bo.q6: "How much do the new extra perks cost?"
sp.bo.q7: "Do extra perks replace the current server level system?"
sp.bo.q8: "Do extra perks use Boosts separate from my server level?"
sp.bo.q9: "Are extra perks a one-time purchase, or do they spend Boosts continuously?"
sp.bo.q1a: "Boosts allow you to support your favorite Servers, by unlocking perks for everyone in them. The more Boosts a server has, the more epic the perks that can be unlocked. See the chart above for more details."
sp.bo.q2a: "You can Boost this server directly on this page! If you want to Boost a different server, you can find step-by-step instructions in our Help Center."
sp.bo.q3a: "Yes, you can Boost a server as many times as you want! The more Boosts the server gets, the better the perks that will be unlocked."
sp.bo.q4a: "Absolutely! Server Boosts are a great way to support your favorite servers. When you Boost a server, you'll be recognized with a special Member List Icon, a Boosting role, and a Profile Badge."
sp.bo.q5a: "Additional Perks are new features you can unlock directly with Boosts, separate from your server's Boost Level. Currently, there are two available: Enhanced Role Styles (which add gradient and holographic effects to roles) and Server Tags (4-character identifiers members can display on their profiles across Discord). Unlike traditional server levels, these perks can be unlocked individually without reaching specific level thresholds."
sp.bo.q6a: "Enhanced Role Styles and Server Tags each cost 3 Boosts. If you want both perks, you'll need 6 Boosts total (3 for each perk)."
sp.bo.q7a: "No, this supplements the existing level system. All current server level perks (emoji slots, file upload limits, etc.) remain exactly the same. This new system simply gives you additional ways to use your Boosts for targeted perks without affecting your server's level progression."
sp.bo.q8a: "Yes, Boosts used for additional perks are dedicated specifically to those perks and don't count toward your server's level progression. Similarly, Boosts allocated to your server level can't be used for additional perks. You'll need separate Boosts for each - so if you want Enhanced Role Styles, you need 3 Boosts just for that perk, plus whatever Boosts you want to maintain your current server level."
sp.bo.q9a: "Each additional perk requires an ongoing allocation of its required Boosts to stay active, just like levels. If your server drops below the required number of Boosts, the perk will be disabled until the necessary Boosts are reallocated."
