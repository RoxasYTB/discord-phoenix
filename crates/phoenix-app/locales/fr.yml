cperm.s0: "Permissions générales de salon"
cperm.l0: "Voir le salon"
cperm.d0: "Permet aux membres de voir ce salon par défaut. En désactivant ceci pour @everyone, le salon deviendra privé."
cperm.l1: "Gérer le salon"
cperm.d1: "Permet aux membres de changer le nom, la description et les paramètres textuels de ce salon. Les membres pourront également supprimer le salon."
cperm.l2: "Gérer les permissions"
cperm.d2: "Permet aux membres de changer les permissions de ce salon."
cperm.l3: "Gérer les webhooks"
cperm.d3: "Permet aux membres de créer, modifier ou supprimer des webhooks dans ce salon, grâce auxquels ils peuvent poster des messages venant d'autres applications ou sites."
cperm.s1: "Permissions des membres"
cperm.l4: "Créer une invitation"
cperm.d4: "Permet aux membres d'inviter de nouvelles personnes sur ce serveur via un lien d'invitation direct vers ce salon."
cperm.s2: "Permissions de salon textuel"
cperm.l5: "Envoyer des messages"
cperm.d5: "Permet aux membres d'envoyer des messages dans ce salon."
cperm.l6: "Envoyer des messages dans les fils"
cperm.d6: "Autoriser les membres à envoyer des messages dans les fils de ce salon."
cperm.l7: "Créer des fils publics"
cperm.d7: "Autoriser les membres à créer des fils que tout le monde dans ce salon peut voir."
cperm.l8: "Créer des fils privés"
cperm.d8: "Autoriser les membres à créer des fils sur invitation dans ce salon."
cperm.l9: "Intégrer des liens"
cperm.d9: "Autorise les liens partagés par les membres à afficher du contenu intégré dans ce salon."
cperm.l10: "Joindre des fichiers"
cperm.d10: "Permet aux membres d'envoyer des fichiers ou médias dans ce salon."
cperm.l11: "Ajouter des réactions"
cperm.d11: "Permet aux membres d'ajouter de nouvelles réactions émojis à un message dans ce salon. Si cette permission est désactivée, les membres peuvent toujours réagir en utilisant les réactions existantes."
cperm.l12: "Utiliser des émojis externes"
cperm.d12: "Permet aux membres d'utiliser des émojis d'autres serveurs dans ce salon, à condition d'être membre Discord Nitro."
cperm.l13: "Utiliser des autocollants externes"
cperm.d13: "Permet aux membres d'utiliser des autocollants d'autres serveurs dans ce salon, à condition d'être membres Discord Nitro."
cperm.l14: "Mentionner @everyone, @here et tous les rôles"
cperm.d14: "Permet aux membres d'utiliser @everyone ou @here (seuls les membres en ligne) dans ce salon. Ils peuvent aussi utiliser @mention pour tous les rôles de ce salon, même si leur permission « Autoriser tout le monde à mentionner ce rôle » est désactivée."
cperm.l15: "Gérer les messages"
cperm.d15: "Permet aux membres de supprimer ou retirer les intégrations des messages d'autres membres dans ce salon."
cperm.l16: "Épingler les messages"
cperm.d16: "Permet aux membres d'épingler ou de désépingler n'importe quel message dans ce salon."
cperm.l17: "Ignorer le mode lent"
cperm.d17: "Permet aux membres d'envoyer des messages dans ce salon sans être affectés par le mode lent."
cperm.l18: "Gérer les fils"
cperm.d18: "Permet aux membres de renommer, supprimer, fermer et activer le mode lent sur les fils de ce salon. Ils peuvent également consulter les fils privés."
cperm.l19: "Voir les anciens messages"
cperm.d19: "Permet aux membres de lire les messages précédemment envoyés dans ce salon. Si cette permission est désactivée, les membres ne verront que les messages envoyés alors qu'ils étaient en ligne."
cperm.l20: "Envoyer des messages de synthèse vocale"
cperm.d20: "Permet aux membres d'envoyer des messages de synthèse vocale dans ce salon en commençant leur message par /tts. Ces messages peuvent être entendus par toutes les personnes pour qui ce salon est en avant-plan."
cperm.l21: "Envoyer des messages vocaux"
cperm.d21: "Permet aux membres d'envoyer des messages vocaux dans ce salon. Nécessite aussi la permission « Joindre des fichiers »."
cperm.l22: "Créer des sondages"
cperm.d22: "Permet aux membres de créer des sondages dans ce salon."
cperm.s3: "Permissions des applications"
cperm.l23: "Utiliser les commandes de l'application"
cperm.d23: "Permet aux membres d'utiliser des commandes provenant d'applications dans ce salon, comme les commandes slash et les commandes de menu contextuel."
cperm.l24: "Utiliser les Activités"
cperm.d24: "Permet aux membres d'utiliser les Activités dans ce salon."
cperm.l25: "Utilise des applications externes"
cperm.d25: "Autorise les applications que les membres ont ajoutées à leur compte à publier des messages dans ce salon. Quand cette option est désactivée, les messages deviendront privés."
cperm.d26: "Permet aux membres de publier leurs propres messages sur tous les serveurs abonnés à ce salon des annonces."
cperm.d27: "Permet aux membres de supprimer les intégrations des messages d'autres membres dans ce salon. Ils peuvent également publier des messages d'autres membres sur tous les serveurs abonnés à ce salon des annonces."
cperm.d28: "Permet aux membres de voir ce salon par défaut. En désactivant ceci et la permission de connexion pour @everyone, le salon deviendra privé."
cperm.d29: "Permet aux membres de changer le nom, la description et les paramètres vocaux de ce salon. Les membres pourront également supprimer le salon."
cperm.d30: "Permet aux membres d'inviter de nouvelles personnes sur ce serveur via un lien d'invitation direct vers ce salon. Le destinataire rejoindra automatiquement le salon vocal s'il dispose de la permission de connexion."
cperm.s4: "Permissions de salon vocal"
cperm.l26: "Se connecter"
cperm.d31: "Permet aux membres de rejoindre ce salon vocal et d'entendre les autres. En désactivant ceci et les permissions Voir le salon pour @everyone, le salon deviendra privé."
cperm.l27: "Parler"
cperm.d32: "Permet aux membres de parler dans ce salon vocal. Si cette permission est désactivée, les membres sont muets par défaut à moins qu'un membre disposant de la permission « Rendre les membres muets » ne leur rende la voix."
cperm.l28: "Vidéo"
cperm.d33: "Permet aux membres de partager leur vidéo, d'utiliser le partage d'écran, ou de streamer un jeu sur ce salon vocal."
cperm.l29: "Utiliser Soundboard"
cperm.d34: "Permet aux membres d'envoyer des sons depuis le Soundboard du serveur dans ce salon vocal. En savoir plus."
cperm.l30: "Utiliser des sons externes"
cperm.d35: "Permet aux membres d'utiliser des sons provenant d'autres serveurs s'ils sont abonnés à Discord Nitro."
cperm.l31: "Utiliser la Détection de la voix"
cperm.d36: "Permet aux membres de discuter dans ce salon vocal simplement en parlant. Si cette permission est désactivée, les membres doivent utiliser Appuyer-pour-parler. Utile pour contrôler les bruits de fond ou les membres trop bruyants."
cperm.l32: "Voix prioritaire"
cperm.d37: "Permet aux membres d'être entendus plus facilement dans ce salon vocal. Lorsque ce mode est activé, le volume des autres utilisateurs n'ayant pas cette permission sera automatiquement baissé. La voix prioritaire est activée en utilisant le raccourci Appuyer-pour-parler (Prioritaire)."
cperm.l33: "Rendre les membres muets"
cperm.d38: "Permet aux membres de rendre les autres membres muets pour tout le monde dans ce salon vocal."
cperm.l34: "Mettre en sourdine des membres"
cperm.d39: "Permet aux membres de mettre en sourdine les autres membres dans ce salon vocal, ce qui les empêchera de parler et d'entendre les autres."
cperm.l35: "Déplacer des membres"
cperm.d40: "Permet aux membres de déconnecter les autres membres de ce salon. Ils pourront également déplacer quelqu'un dans d'autres salons dans lesquels ils ont cette permission."
cperm.l36: "Définir un statut pour le salon vocal"
cperm.d41: "Permet aux membres de créer et de modifier le statut d'un salon vocal."
cperm.s5: "Permissions de salon de discussion vocale"
cperm.d42: "Permet aux membres d'ajouter de nouvelles réactions émojis à un message dans ce salon et d'envoyer des réactions dans un salon vocal. Si cette permission est désactivée, les membres peuvent toujours réagir en utilisant les réactions existantes."
cperm.s6: "Permissions des événements"
cperm.l37: "Créer des événements"
cperm.d43: "Permet aux membres de créer des événements dans ce salon."
cperm.l38: "Gérer les événements"
cperm.d44: "Permet aux membres de modifier ou d'annuler des événements dans ce salon."
cperm.d45: "(Requis pour les modérateurs de conférence) Permet aux membres de définir un sujet pour commencer la conférence et activer ou désactiver les demandes de prise de parole. Ils peuvent aussi supprimer le salon de conférence."
cperm.d46: "Permet aux membres de rejoindre ce salon de conférence en tant qu'audience. En désactivant ceci et les permissions « Voir le salon » pour @everyone, le salon deviendra privé."
cperm.d47: "Permet aux intervenants de partager leur vidéo, d'utiliser le partage d'écran, ou de streamer un jeu sur ce salon de conférence."
cperm.d48: "(Requis pour les modérateurs de conférence) Permet aux membres d'ajouter ou de supprimer des intervenants."
cperm.d49: "(Requis pour les modérateurs de conférence) Permet aux membres de forcer la déconnexion d'autres membres du salon."
cperm.s7: "Permissions de salon de conférence"
cperm.l39: "Demande de prise de parole"
cperm.d50: "Autorise les demandes de prise de parole dans ce salon de conférence. Les modérateurs de conférence valident ou rejettent manuellement chaque demande."
cperm.l40: "Mentionne @everyone lorsqu'une conférence commence"
cperm.d51: "Autorise les modérateurs de conférence avec ce rôle à notifier @everyone quand une conférence est lancée. C'est la même permission que Mentionner @everyone, @here et tous les rôles."
cperm.s8: "Permissions du salon forum"
cperm.l41: "Créer des posts"
cperm.d52: "Autoriser les membres à créer des posts dans ce salon."
cperm.l42: "Envoyer des messages dans les posts"
cperm.d53: "Autoriser les membres à envoyer des messages dans les fils et les posts de ce salon."
cperm.l43: "Gérer les posts"
cperm.d54: "Permet aux membres de renommer, supprimer, fermer et activer le mode lent sur les posts de ce salon."
cperm.l44: "Voir les anciens posts"
cperm.d55: "Permet aux membres de lire les messages et les posts précédemment créés dans ce salon. Si cette permission est désactivée, les membres ne verront que les messages et les posts créés alors qu'ils étaient en ligne."
cperm.d56: "Permet aux membres d'utiliser les Activités dans les fils de discussion de ce salon."
cperm.d57: "Permet aux membres d'utiliser les Applications externes dans les fils de discussion de ce salon."
cperm.s9: "Permissions générales de catégorie"
cperm.l45: "Voir les salons"
cperm.d58: "Permet aux membres de voir ces salons par défaut. En désactivant ceci pour @everyone, les salons textuels deviendront privés. En désactivant ceci et la permission de connexion pour @everyone, les salons vocaux deviendront privés."
cperm.l46: "Gérer les salons"
cperm.d59: "Permet aux membres de changer le nom, la description et les paramètres vocaux/textuels de ces salons. Les membres pourront également supprimer les salons."
cperm.d60: "Permet aux membres de changer les permissions de ces salons."
cperm.d61: "Permet aux membres de créer, modifier ou supprimer des webhooks dans ces salons, grâce auxquels ils peuvent poster des messages venant d'autres applications ou sites."
cperm.d62: "Permet aux membres d'inviter de nouvelles personnes sur ce serveur via un lien d'invitation direct vers ces salons."
cperm.l47: "Envoyer des messages et créer des posts"
cperm.d63: "Autoriser les membres à envoyer des messages et créer des posts dans ces salons."
cperm.l48: "Envoyer des messages dans les fils et les posts"
cperm.d64: "Autoriser les membres à envoyer des messages dans les fils et les posts de ces salons."
cperm.d65: "Autoriser les membres à créer des fils que tout le monde dans ces salons peut voir."
cperm.d66: "Autoriser les membres à créer des fils sur invitation dans ces salons."
cperm.d67: "Autorise les liens partagés par les membres à afficher du contenu intégré dans ces salons."
cperm.d68: "Permet aux membres d'envoyer des fichiers ou médias dans ces salons."
cperm.d69: "Permet aux membres d'ajouter de nouvelles réactions émojis à un message dans ces salons. Si cette permission est désactivée, les membres peuvent toujours réagir en utilisant les réactions existantes."
cperm.d70: "Permet aux membres d'utiliser des émojis d'autres serveurs dans ces salons, à condition d'être membre Discord Nitro."
cperm.d71: "Permet aux membres d'utiliser des autocollants d'autres serveurs dans ces salons, à condition d'être membres Discord Nitro."
cperm.d72: "Permet aux membres d'utiliser @everyone ou @here (seuls les membres en ligne) dans ces salons. Ils peuvent aussi utiliser @mention pour tous les rôles de ces salons, même si leur permission « Autoriser tout le monde à mentionner ce rôle » est désactivée."
cperm.d73: "Permet aux membres de supprimer ou retirer les intégrations des messages d'autres membres dans ces salons."
cperm.d74: "Permet aux membres d'épingler ou de désépingler n'importe quel message dans ces salons."
cperm.d75: "Permet aux membres d'envoyer des messages dans ces salons sans être affectés par le mode lent."
cperm.l49: "Gérer les fils et les posts"
cperm.d76: "Permet aux membres de renommer, supprimer, fermer et activer le mode lent sur les fils et les posts de ces salons. Ils peuvent également consulter les fils privés."
cperm.d77: "Permet aux membres de lire les messages précédemment envoyés dans ces salons. Si cette permission est désactivée, les membres ne verront que les messages envoyés alors qu'ils étaient en ligne."
cperm.d78: "Permet aux membres d'envoyer des messages de synthèse vocale dans ces salons en commençant leur message par /tts. Ces messages peuvent être entendus par toutes les personnes pour qui ce salon est en avant-plan."
cperm.d79: "Permet aux membres d'envoyer des messages vocaux dans ces salons. Nécessite aussi la permission « Joindre des fichiers »."
cperm.d80: "Permet aux membres de créer des sondages dans ces salons."
cperm.d81: "Permet aux membres de rejoindre ces salons vocaux et d'entendre les autres. En désactivant ceci et les permissions Voir le salon pour @everyone, les salons deviendront privés."
cperm.d82: "Permet aux membres de parler dans ces salons vocaux. Si cette permission est désactivée, les membres sont muets par défaut à moins qu'un membre disposant de la permission « Rendre les membres muets » ne leur rende la voix."
cperm.d83: "Permet aux membres de partager leur vidéo, d'utiliser le partage d'écran, ou de streamer un jeu sur ces salons vocaux."
cperm.d84: "Permet aux membres d'envoyer des sons depuis le Soundboard du serveur dans ces salons vocaux. En savoir plus."
cperm.d85: "Permet aux membres de discuter dans ces salons vocaux simplement en parlant. Si cette permission est désactivée, les membres doivent utiliser Appuyer-pour-parler. Utile pour contrôler les bruits de fond ou les membres trop bruyants."
cperm.d86: "Permet aux membres d'être entendus plus facilement dans ces salons vocaux. Lorsque ce mode est activé, le volume des autres utilisateurs n'ayant pas cette permission sera automatiquement baissé. La voix prioritaire est activée en utilisant le raccourci Appuyer-pour-parler (Prioritaire)."
cperm.d87: "Permet aux membres de rendre les autres membres muets pour tout le monde dans ces salons vocaux."
cperm.d88: "Permet aux membres de mettre en sourdine les autres membres dans ces salons vocaux, ce qui les empêchera de parler et d'entendre les autres."
cperm.d89: "Permet aux membres de déconnecter les autres membres de ces salons. Ils pourront également déplacer quelqu'un dans d'autres salons dans lesquels ils ont cette permission."
cperm.d90: "Permet aux membres d'utiliser des commandes provenant d'applications dans ces salons, comme les commandes slash et les commandes de menu contextuel."
cperm.d91: "Permet aux membres d'utiliser les Activités dans ces salons."
cperm.d92: "Autorise les applications que les membres ont ajoutées à leur compte à publier des messages dans ces salons. Quand cette option est désactivée, les messages deviendront privés."
cperm.d93: "Autorise les demandes de prise de parole dans ces salons de conférence. Les modérateurs de conférence valident ou rejettent manuellement chaque demande."
cperm.d94: "Permet aux membres de créer des événements dans ces salons."
cperm.d95: "Permet aux membres de modifier ou d'annuler des événements dans ces salons."
