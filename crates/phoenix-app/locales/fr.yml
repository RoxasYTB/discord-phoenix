gs.perm.s0: "Permissions générales de serveur"
gs.perm.p10: "Voir les salons"
gs.perm.p10_desc: "Permet aux membres de voir les salons par défaut (à l'exception des salons privés)."
gs.perm.p4: "Gérer les salons"
gs.perm.p4_desc: "Permet aux membres de créer, modifier ou supprimer des salons."
gs.perm.p28: "Gérer les rôles"
gs.perm.p28_desc: "Permet aux membres de créer de nouveaux rôles et de modifier ou de supprimer les rôles inférieurs à leur rôle le plus élevé. Permet également aux membres de changer les permissions des salons individuels auxquels ils ont accès."
gs.perm.p43: "Créer des expressions"
gs.perm.p43_desc: "Permet aux membres d'ajouter des émojis, autocollants et sons personnalisés sur ce serveur."
gs.perm.p30: "Gérer les expressions"
gs.perm.p30_desc: "Permet aux membres de modifier ou de supprimer des émojis, autocollants et sons personnalisés sur ce serveur."
gs.perm.p7: "Voir les logs du serveur"
gs.perm.p7_desc: "Permet aux membres de voir un récapitulatif des personnes ayant effectué des changements sur ce serveur."
gs.perm.p19: "Voir les analyses de serveur"
gs.perm.p19_desc: "Permet aux membres de consulter les Analyses de serveur, qui présentent des données sur la croissance de la communauté, l'engagement et plus encore. Cela leur permettra de voir certaines données sur l'activité des salons, même pour les salons auxquels ils ne peuvent pas accéder."
gs.perm.p29: "Gérer les webhooks"
gs.perm.p29_desc: "Permet aux membres de créer, modifier ou supprimer des webhooks, grâce auxquels ils peuvent poster des messages venant d'autres applications ou sites sur ce serveur."
gs.perm.p5: "Gérer le serveur"
gs.perm.p5_desc: "Autorise les membres à modifier le nom de ce serveur, à changer de région, à voir toutes les invitations, à ajouter des applications à ce serveur et à créer et mettre à jour les règles d'AutoMod."
gs.perm.s1: "Permissions des membres"
gs.perm.p0: "Créer une invitation"
gs.perm.p0_desc: "Permet aux membres d'inviter de nouvelles personnes sur ce serveur."
gs.perm.p26: "Changer le pseudo"
gs.perm.p26_desc: "Permet aux membres de changer leur propre pseudo en un nom personnalisé utilisé uniquement sur ce serveur."
gs.perm.p27: "Gérer les pseudos"
gs.perm.p27_desc: "Permet aux membres de changer le pseudo des autres membres."
gs.perm.p1: "Expulser, accepter et refuser des membres"
gs.perm.p1_desc: "L'expulsion retirera d'autres membres de ce serveur. Les membres expulsés pourront rejoindre le serveur de nouveau s'ils ont une autre invitation. Si le serveur active les conditions pour devenir membre, cette permission permet d'accepter ou de rejeter les candidatures pour devenir membre."
gs.perm.p2: "Bannir des membres"
gs.perm.p2_desc: "Permet aux membres de bannir de manière permanente et de supprimer l'historique des messages d'autres membres de ce serveur."
gs.perm.p40: "Exclure temporairement des membres"
gs.perm.p40_desc: "Un utilisateur temporairement exclu ne peut pas envoyer de messages dans la discussion, répondre à un fil, réagir aux messages ou parler dans un salon vocal ou un salon de conférence."
gs.perm.s2: "Permissions de salon textuel"
gs.perm.p11: "Envoyer des messages et créer des posts"
gs.perm.p11_desc: "Autoriser les membres à envoyer des messages dans les salons textuels et créer des posts dans les salons forum."
gs.perm.p38: "Envoyer des messages dans les fils et les posts"
gs.perm.p38_desc: "Autoriser les membres à envoyer des messages dans les fils et les posts dans les salons forum."
gs.perm.p35: "Créer des fils publics"
gs.perm.p35_desc: "Autoriser les membres à créer des fils que tout le monde dans un salon peut voir."
gs.perm.p36: "Créer des fils privés"
gs.perm.p36_desc: "Autoriser les membres à créer des fils sur invitation."
gs.perm.p14: "Intégrer des liens"
gs.perm.p14_desc: "Autorise les liens partagés par les membres à afficher du contenu intégré dans les salons textuels."
gs.perm.p15: "Joindre des fichiers"
gs.perm.p15_desc: "Permet aux membres d'envoyer des fichiers ou médias dans les salons textuels."
gs.perm.p6: "Ajouter des réactions"
gs.perm.p6_desc: "Permet aux membres d'ajouter de nouvelles réactions émojis à un message. Si cette permission est désactivée, les membres peuvent toujours réagir en utilisant les réactions existantes."
gs.perm.p18: "Utiliser des émojis externes"
gs.perm.p18_desc: "Permet aux membres d'utiliser des émojis d'autres serveurs, à condition d'être membre Discord Nitro."
gs.perm.p37: "Utiliser des autocollants externes"
gs.perm.p37_desc: "Permet aux membres d'utiliser des autocollants d'autres serveurs, à condition d'être membres Discord Nitro."
gs.perm.p17: "Mentionner @everyone, @here et tous les rôles"
gs.perm.p17_desc: "Permet aux membres d'utiliser @everyone (tout le monde sur le serveur) ou @here (seuls les membres en ligne sur ce salon). Ils peuvent aussi utiliser @mention pour tous les rôles, même si leur permission « Autoriser tout le monde à mentionner ce rôle » est désactivée."
gs.perm.p13: "Gérer les messages"
gs.perm.p13_desc: "Permet aux membres de supprimer ou retirer les intégrations des messages d'autres membres."
gs.perm.p51: "Épingler les messages"
gs.perm.p51_desc: "Permet aux membres d'épingler ou de désépingler n'importe quel message."
gs.perm.p52: "Ignorer le mode lent"
gs.perm.p52_desc: "Permet aux membres d'envoyer des messages sans être affectés par le mode lent."
gs.perm.p34: "Gérer les fils et les posts"
gs.perm.p34_desc: "Permet aux membres de renommer, supprimer, fermer et activer le mode lent sur les fils et les posts. Ils peuvent également consulter les fils privés."
gs.perm.p16: "Voir les anciens messages"
gs.perm.p16_desc: "Permet aux membres de lire les messages précédemment envoyés dans les salons. Si cette permission est désactivée, les membres ne verront que les messages envoyés alors qu'ils étaient en ligne. Cela ne s'applique pas entièrement aux fils et aux posts des forums."
gs.perm.p12: "Envoyer des messages de synthèse vocale"
gs.perm.p12_desc: "Permet aux membres d'envoyer des messages de synthèse vocale en commençant leur message par /tts. Ces messages peuvent être entendus par toutes les personnes pour qui le salon est en avant-plan."
gs.perm.p46: "Envoyer des messages vocaux"
gs.perm.p46_desc: "Permet aux membres d'envoyer des messages vocaux."
gs.perm.p49: "Créer des sondages"
gs.perm.p49_desc: "Permet aux membres de créer des sondages."
gs.perm.s3: "Permissions de salon vocal"
gs.perm.p20: "Se connecter"
gs.perm.p20_desc: "Permet aux membres de rejoindre les salons vocaux et d'entendre les autres."
gs.perm.p21: "Parler"
gs.perm.p21_desc: "Permet aux membres de parler dans les salons vocaux. Si cette permission est désactivée, les membres sont muets par défaut à moins qu'un membre disposant de la permission « Rendre les membres muets » ne leur rende la voix."
gs.perm.p9: "Vidéo"
gs.perm.p9_desc: "Permet aux membres de partager leur vidéo, d'utiliser le partage d'écran, ou de streamer un jeu sur ce serveur."
gs.perm.p42: "Utiliser Soundboard"
gs.perm.p42_desc: "Permet aux membres d'envoyer des sons depuis le Soundboard du serveur."
gs.perm.p45: "Utiliser des sons externes"
gs.perm.p45_desc: "Permet aux membres d'utiliser des sons provenant d'autres serveurs s'ils sont abonnés à Discord Nitro."
gs.perm.p25: "Utiliser la Détection de la voix"
gs.perm.p25_desc: "Permet aux membres de discuter dans les salons vocaux simplement en parlant. Si cette permission est désactivée, les membres doivent utiliser Appuyer-pour-parler. Utile pour contrôler les bruits de fond ou les membres trop bruyants."
gs.perm.p8: "Voix prioritaire"
gs.perm.p8_desc: "Permet aux membres d'être entendus plus facilement dans les salons vocaux. Lorsque ce mode est activé, le volume des autres utilisateurs n'ayant pas cette permission sera automatiquement baissé."
gs.perm.p22: "Rendre les membres muets"
gs.perm.p22_desc: "Permet aux membres de rendre les autres membres muets pour tout le monde dans les salons vocaux."
gs.perm.p23: "Mettre en sourdine des membres"
gs.perm.p23_desc: "Permet aux membres de mettre en sourdine les autres membres dans les salons vocaux, ce qui les empêchera de parler et d'entendre les autres."
gs.perm.p24: "Déplacer des membres"
gs.perm.p24_desc: "Permet aux membres de déconnecter les autres membres ou de les déplacer entre les salons vocaux auxquels le membre avec cette permission a accès."
gs.perm.p48: "Définir un statut pour le salon vocal"
gs.perm.p48_desc: "Permet aux membres de créer et de modifier le statut d'un salon vocal."
gs.perm.s4: "Permissions des applications"
gs.perm.p31: "Utiliser les commandes de l'application"
gs.perm.p31_desc: "Permet aux membres d'utiliser des commandes provenant d'applications, comme les commandes slash et les commandes de menu contextuel."
gs.perm.p39: "Utiliser les Activités"
gs.perm.p39_desc: "Permet aux membres d'utiliser les Activités."
gs.perm.p50: "Utilise des applications externes"
gs.perm.p50_desc: "Autorise les applications que les membres ont ajoutées à leur compte à publier des messages. Quand cette option est désactivée, les messages deviendront privés."
gs.perm.s5: "Permissions de salon de conférence"
gs.perm.p32: "Demande de prise de parole"
gs.perm.p32_desc: "Autorise les demandes de prise de parole dans les salons de conférence. Les modérateurs de conférence valident ou rejettent manuellement chaque demande."
gs.perm.s6: "Permissions des événements"
gs.perm.p44: "Créer des événements"
gs.perm.p44_desc: "Permet aux membres de créer des événements."
gs.perm.p33: "Gérer les événements"
gs.perm.p33_desc: "Permet aux membres de modifier ou annuler des événements."
gs.perm.s7: "Permissions avancées"
gs.perm.p3: "Administrateur"
gs.perm.p3_desc: "Les membres ayant cette permission auront toutes les permissions et pourront aussi outrepasser toutes les permissions ou restrictions associées à des salons spécifiques (par exemple, ces membres auront accès à tous les salons privés). Un grand pouvoir implique de grandes responsabilités, alors réfléchis-y à deux fois avant d'accorder cette permission !"
