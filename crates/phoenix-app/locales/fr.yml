sp.data.t1: "Comment Discord utilise mes données"
sp.data.core: "Utiliser les données pour que Discord fonctionne"
sp.data.core_d: "Discord a besoin de stocker et traiter des données afin de te fournir les fonctionnalités de base de Discord telles que tes messages, les serveurs dans lesquels tu es et tes messages privés. En utilisant Discord, tu autorises Discord à fournir ces fonctionnalités de base. Tu peux arrêter tout ça en désactivant ou supprimant ton compte."
sp.data.improve: "Utiliser les données pour améliorer Discord"
sp.data.improve_d: "Cela permet à Discord d'utiliser et de traiter mes informations afin de comprendre et améliorer les services de Discord."
sp.data.personalize: "Utiliser mes données pour personnaliser mon expérience sur Discord"
sp.data.personalize_d: "Ceci autorise Discord à utiliser tes informations (comme tes interlocuteurs ou les jeux auxquels tu joues) afin de personnaliser Discord rien que pour toi."
sp.data.sponsored: "Utiliser mon activité Discord pour personnaliser du contenu sponsorisé"
sp.data.sponsored_d: "Cela permet à Discord de personnaliser le contenu sponsorisé, comme les quêtes, en utilisant ton Activité Discord, comme les jeux auxquels tu joues. Si tu désactives cette option, tu pourras toujours voir les quêtes, mais elles ne seront pas personnalisées."
sp.data.third: "Utiliser des données tierces pour personnaliser du contenu sponsorisé"
sp.data.third_d: "Cela permet à Discord de personnaliser le contenu sponsorisé, comme les quêtes, en utilisant les données que Discord reçoit des annonceurs et des fournisseurs de données tiers. Si tu désactives cette option, tu pourras toujours voir les quêtes, mais elles ne seront pas personnalisées en utilisant des données tierces."
sp.data.discovery: "Affiche le contenu de mes messages provenant des salons en mode Découverte sur les pages internet"
sp.data.discovery_d: "Autorise le contenu des messages que tu envoies dans les salons en mode Découverte à apparaître sur des pages internet. Les administrateurs des serveurs en mode Découverte contrôlent quels salons sont en mode Découverte. Ces messages apparaîtront tels que tu les as écrits, mais ne montreront pas ton nom d'utilisateur."
sp.data.clips: "Autoriser l'enregistrement de ma voix dans les clips"
