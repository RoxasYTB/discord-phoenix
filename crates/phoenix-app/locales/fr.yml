sp.bo.faq: "FAQ sur les boosts"
sp.bo.q1: "Qu'est-ce qu'un boost de serveur ?"
sp.bo.q2: "Comment puis-je booster un serveur ?"
sp.bo.q3: "Puis-je booster un serveur plusieurs fois ?"
sp.bo.q4: "Puis-je continuer à booster un serveur une fois qu'il a atteint le niveau 3 ?"
sp.bo.q5: "Que sont les « avantages supplémentaires » et en quoi sont-ils différents des niveaux ?"
sp.bo.q6: "Combien coûtent les nouveaux avantages supplémentaires ?"
sp.bo.q7: "Les avantages supplémentaires remplacent-ils le système de niveau actuel du serveur ?"
sp.bo.q8: "Les avantages supplémentaires utilisent-ils des Boosts séparés de mon niveau de serveur ?"
sp.bo.q9: "Les avantages supplémentaires sont-ils un achat unique, ou nécessitent-ils de dépenser des Boosts en continu ?"
sp.bo.q1a: "Les boosts te permettent de soutenir tes serveurs préférés en débloquant des avantages pour tous leurs membres. Plus un serveur a de boosts, plus les avantages débloqués sont épiques. Consulte le tableau ci-dessus pour plus de détails."
sp.bo.q2a: "Tu peux booster ce serveur directement sur cette page ! Pour booster un autre serveur, tu trouveras les instructions étape par étape dans notre Centre d'aide."
sp.bo.q3a: "Oui, tu peux booster un serveur autant de fois que tu veux ! Plus le serveur reçoit de boosts, meilleurs sont les avantages débloqués."
sp.bo.q4a: "Absolument ! Les boosts de serveur sont un excellent moyen de soutenir tes serveurs préférés. Quand tu boostes un serveur, tu es reconnu grâce à une icône spéciale dans la liste des membres, un rôle de booster et un badge de profil."
sp.bo.q5a: "Les avantages supplémentaires sont de nouvelles fonctionnalités que tu peux débloquer directement avec des boosts, indépendamment du niveau de boost de ton serveur. Il y en a actuellement deux : les styles de rôle améliorés (qui ajoutent des effets de dégradé et holographiques aux rôles) et les tags de serveur (des identifiants de 4 caractères que les membres peuvent afficher sur leur profil partout sur Discord). Contrairement aux niveaux de serveur classiques, ces avantages peuvent être débloqués individuellement sans atteindre de palier."
sp.bo.q6a: "Les styles de rôle améliorés et les tags de serveur coûtent chacun 3 boosts. Pour avoir les deux, il te faut 6 boosts au total (3 par avantage)."
sp.bo.q7a: "Non, il s'agit d'un complément au système de niveaux existant. Tous les avantages actuels des niveaux de serveur (emplacements d'emojis, limite d'envoi de fichiers, etc.) restent exactement les mêmes. Ce nouveau système te donne simplement d'autres façons d'utiliser tes boosts pour des avantages ciblés, sans affecter la progression du niveau de ton serveur."
sp.bo.q8a: "Oui, les boosts utilisés pour les avantages supplémentaires leur sont exclusivement dédiés et ne comptent pas dans la progression du niveau de ton serveur. De même, les boosts attribués au niveau du serveur ne peuvent pas servir aux avantages supplémentaires. Il te faut des boosts distincts pour chacun : pour les styles de rôle améliorés, il te faut 3 boosts rien que pour cet avantage, en plus des boosts nécessaires pour maintenir le niveau actuel de ton serveur."
sp.bo.q9a: "Chaque avantage supplémentaire nécessite une attribution continue des boosts requis pour rester actif, comme les niveaux. Si ton serveur passe sous le nombre de boosts requis, l'avantage est désactivé jusqu'à ce que les boosts nécessaires soient réattribués."
