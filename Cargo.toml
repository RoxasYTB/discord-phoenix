[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/*"]

[workspace.package]
version = "0.1.0-beta.2"
edition = "2024"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[patch.crates-io]
gpui-pre = { git = "https://github.com/RoxasYTB/project-phoenix", rev = "d00bee73a0f381892f6b697c8e377848a497b982" }
gpui-pre-wgpu = { git = "https://github.com/RoxasYTB/project-phoenix", rev = "d00bee73a0f381892f6b697c8e377848a497b982" }
gpui-base = { git = "https://github.com/RoxasYTB/project-phoenix", rev = "d00bee73a0f381892f6b697c8e377848a497b982" }
